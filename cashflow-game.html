<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财富自由 · 现金流游戏</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
  background: #0d1117;
  color: #c9d1d9;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ====== Game Container ====== */
#game-container {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 10px;
  display: none;
}

/* ====== Header ====== */
#game-header {
  background: linear-gradient(135deg, #1a1f2e, #16213e);
  border: 1px solid #30363d;
  border-radius: 12px;
  padding: 12px 24px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}
#game-header h1 {
  font-size: 1.4em;
  background: linear-gradient(135deg, #f0c040, #e8a020);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 900;
}
.header-info {
  display: flex;
  gap: 20px;
  align-items: center;
  flex-wrap: wrap;
}
.header-info span {
  font-size: 1.05em;
}
.header-info .label { color: #8b949e; }
.header-info .value { color: #f0c040; font-weight: bold; font-size: 1.2em; }

/* Easter egg charging animation */
.easter-charging {
  animation: easterPulse 1s ease-in-out infinite;
}
@keyframes easterPulse {
  0%, 100% { text-shadow: 0 0 0px rgba(248,81,73,0); }
  50% { text-shadow: 0 0 12px rgba(248,81,73,0.4); }
}

/* ====== Main Layout ====== */
#main-layout {
  display: flex;
  gap: 10px;
  height: calc(100vh - 120px);
}
#board-area {
  flex: 1;
  min-width: 500px;
  position: relative;
  background: #0d1117;
  border: 2px solid #30363d;
  border-radius: 0;
  overflow: hidden;
  image-rendering: pixelated;
}
/* Subtle pixel grid overlay on board */
#board-area::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 4px 4px;
}
#side-panel {
  width: 370px;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
/* Top fixed zone: always visible financial summary */
#side-top {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
/* Middle scroll zone: children + assets */
#side-mid {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px 0;
}
#side-mid::-webkit-scrollbar { width: 4px; }
#side-mid::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
/* Bottom fixed zone: dice + controls */
#side-bot {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* ====== HTML Board (Monopoly-Style) ====== */
#board-grid {
  display: grid;
  grid-template-columns: 82px 1fr 82px;
  grid-template-rows: 82px 1fr 82px;
  width: 100%;
  height: 100%;
  gap: 2px;
  background: #0d1117;
}
/* ====== Sewer grate corners (pixel style) ====== */
.board-corner {
  position: relative;
  background: #0d1117;
  border-radius: 0;
  border: 4px solid #2a2d33;
  overflow: hidden;
}
/* Cast-iron rim */
.board-corner::before {
  content: '';
  position: absolute;
  inset: 2px;
  border-radius: 0;
  border: 3px solid #3a3d44;
  background: #11151a;
  z-index: 0;
}
/* Cross-hatched grille: vertical bars */
.grate {
  position: absolute;
  inset: 10px;
  border-radius: 0;
  overflow: hidden;
  z-index: 1;
  background:
    repeating-linear-gradient(0deg, #1a1e24 0px, #1a1e24 4px, transparent 4px, transparent 10px);
}
/* Horizontal bars overlay */
.grate::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 0;
  background:
    repeating-linear-gradient(90deg, #1a1e24 0px, #1a1e24 4px, transparent 4px, transparent 10px);
}
/* Dark void showing through gaps */
.grate::before {
  content: '';
  position: absolute;
  inset: 0;
  background: #06080a;
}
/* Edge tile containers */
.board-edge {
  display: flex;
  gap: 3px;
}
.board-edge-top    { grid-column: 2; grid-row: 1; flex-direction: row; }
.board-edge-right  { grid-column: 3; grid-row: 2; flex-direction: column; }
.board-edge-bottom { grid-column: 2; grid-row: 3; flex-direction: row-reverse; }
.board-edge-left   { grid-column: 1; grid-row: 2; flex-direction: column-reverse; }

/* Individual tile */
.btile {
  flex: 1;
  min-width: 0;
  min-height: 0;
  border: 2px solid #30363d;
  border-radius: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 0.9em;
  line-height: 1.2;
  cursor: default;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
  padding: 4px 3px;
  font-family: 'Courier New', monospace;
  image-rendering: pixelated;
}
/* Pixel-art border effect */
.btile::before {
  content: '';
  position: absolute;
  inset: -2px;
  border: 1px solid rgba(255,255,255,0.05);
  pointer-events: none;
}
.btile .bt-icon   { font-size: 2.4em; line-height: 1; }
.btile .bt-name   { color: #c9d1d9; font-weight: bold; margin-top: 2px; font-size: 1.0em; letter-spacing: 0.5px; }
.btile .bt-num    { position: absolute; font-size: 0.85em; color: #484f58; font-family: 'Courier New', monospace; }
.board-edge-top    .btile .bt-num { bottom: 2px; right: 4px; }
.board-edge-bottom .btile .bt-num { top: 2px; right: 4px; }
.board-edge-right  .btile .bt-num { bottom: 2px; left: 4px; }
.board-edge-left   .btile .bt-num { top: 2px; left: 4px; }

/* Tile type colors */
.btile.t-payday     { background: #1a3a2a; border-color: #238636; }
.btile.t-opportunity{ background: #1a2a3a; border-color: #1f6feb; }
.btile.t-business   { background: #1a2a3a; border-color: #1f6feb; }
.btile.t-market     { background: #3a2a1a; border-color: #d2991d; }
.btile.t-doodad     { background: #3a1a1a; border-color: #da3633; }
.btile.t-charity    { background: #3a1a3a; border-color: #a371f7; }
.btile.t-child      { background: #2a3a2a; border-color: #3fb950; }
.btile.t-unemployment,.btile.t-divorce,.btile.t-tax_audit,.btile.t-lawsuit { background: #2a1a1a; border-color: #f85149; }
.btile.t-dream      { background: #3a2a0a; border-color: #f0c040; }
.btile.t-fast_payday{ background: #1a3a2a; border-color: #3fb950; }

/* Current position highlight - pixel glow */
.btile.current {
  border-color: #f0c040 !important;
  border-width: 3px;
  box-shadow: 0 0 10px rgba(240,192,64,0.6), 0 0 30px rgba(240,192,64,0.25);
  z-index: 2;
  transform: scale(1.08);
}
.btile.current .bt-name { color: #f0c040; }
.btile.current .bt-icon { filter: drop-shadow(0 0 4px rgba(240,192,64,0.6)); }
.btile.current::after {
  content: '▼';
  position: absolute;
  color: #f0c040;
  font-size: 1.6em;
  pointer-events: none;
}
.board-edge-top    .btile.current::after { bottom: -16px; }
.board-edge-bottom .btile.current::after { top: -16px; }
.board-edge-right  .btile.current::after { left: -14px; transform: rotate(90deg); }
.board-edge-left   .btile.current::after { right: -14px; transform: rotate(-90deg); }

/* Center info */
#board-center {
  grid-column: 2; grid-row: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 16px;
  background: radial-gradient(ellipse at center, #1a2030 0%, #0d1117 80%);
}
#board-center .bc-stage {
  font-size: 1.8em;
}
#board-center .bc-title {
  font-size: 1.3em;
  font-weight: bold;
  color: #f0c040;
  text-align: center;
}
#board-center .bc-sub {
  font-size: 0.85em;
  color: #8b949e;
  text-align: center;
}
#board-center .bc-progress {
  background: #1c2333;
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 1em;
  font-weight: bold;
  color: #f0c040;
}

/* ====== Side Panels ====== */
.panel {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 10px 12px;
}
.panel h3 {
  font-size: 0.98em;
  color: #f0c040;
  margin-bottom: 7px;
  border-bottom: 1px solid #30363d;
  padding-bottom: 5px;
}
.fin-row {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  font-size: 0.95em;
}
.fin-row .fin-label { color: #8b949e; }
.fin-row .fin-val { color: #e6edf3; font-weight: bold; font-size: 1.1em; }
.fin-row .fin-pos { color: #3fb950; font-size: 1.1em; }
.fin-row .fin-neg { color: #f85149; font-size: 1.1em; }

.passive-highlight {
  background: #161b22;
  border: 1px solid #21262d;
  border-radius: 8px;
  padding: 8px 10px;
  margin: 6px 0;
}
.progress-bar {
  width: 100%;
  height: 18px;
  background: #0d1117;
  border-radius: 9px;
  overflow: hidden;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
  position: relative;
}
.progress-bar::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 50%);
  pointer-events: none;
  border-radius: 9px;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #1a5c2a 0%, #238636 40%, #3fb950 70%, #6be07e 100%);
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  min-width: 4px;
  border-radius: 9px;
  position: relative;
  box-shadow: 0 0 12px rgba(63,185,80,0.35);
}
.progress-text {
  display: flex;
  justify-content: space-between;
  font-size: 0.82em;
  color: #8b949e;
  margin-top: 5px;
  letter-spacing: 0.3px;
}
.progress-text .free { color: #3fb950; font-weight: bold; font-size: 1.3em; }

/* ====== Assets List ====== */
.asset-item {
  background: #1c2333;
  border-radius: 6px;
  padding: 8px;
  margin: 4px 0;
  font-size: 0.88em;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.asset-item .sell-btn {
  background: #f85149;
  color: white;
  border: none;
  border-radius: 4px;
  padding: 2px 8px;
  cursor: pointer;
  font-size: 0.75em;
}

/* ====== Control Area ====== */
#control-area {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  padding: 10px 0;
}
.btn {
  background: linear-gradient(135deg, #f0c040, #d4941a);
  color: #0d1117;
  border: none;
  border-radius: 8px;
  padding: 10px 24px;
  font-size: 1em;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(240,192,64,0.3); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-sm { padding: 5px 12px; font-size: 0.8em; }
.btn-red { background: linear-gradient(135deg, #f85149, #da3633); color: white; }
.btn-blue { background: linear-gradient(135deg, #58a6ff, #388bfd); color: white; }

#dice-area {
  display: flex;
  align-items: center;
  gap: 14px;
  justify-content: center;
}
/* Pixel 3D dice - isometric cube look */
.dice {
  width: 56px; height: 56px;
  background: #e8e0d0;
  border: 3px solid #1a1a2e;
  border-radius: 2px;
  position: relative;
  image-rendering: pixelated;
  /* 3D isometric shadow edges */
  box-shadow:
    3px 3px 0 #0d0d1a,
    6px 6px 0 #06060f,
    4px 4px 8px rgba(0,0,0,0.5);
  transition: transform 0.08s ease;
}
/* Shimmer highlight for top-left edge */
.dice::before {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 12px; height: 12px;
  background: rgba(255,255,255,0.4);
  pointer-events: none;
}
/* Dot grid - all 9 possible positions, hidden by default */
.dice .dot {
  position: absolute;
  width: 12px; height: 12px;
  background: #1a1a2e;
  border-radius: 50%;
  display: none;
}
/* 3x3 grid positions */
.dice .dot.c { top: 50%; left: 50%; transform: translate(-50%,-50%); }
.dice .dot.tl { top: 6px; left: 6px; }
.dice .dot.tr { top: 6px; right: 6px; }
.dice .dot.bl { bottom: 6px; left: 6px; }
.dice .dot.br { bottom: 6px; right: 6px; }
.dice .dot.ml { top: 50%; left: 6px; transform: translateY(-50%); }
.dice .dot.mr { top: 50%; right: 6px; transform: translateY(-50%); }
.dice .dot.mt { top: 6px; left: 50%; transform: translateX(-50%); }
.dice .dot.mb { bottom: 6px; left: 50%; transform: translateX(-50%); }

/* Show dots based on data-face */
.dice[data-face="1"] .dot.c  { display: block; }
.dice[data-face="2"] .dot.tl,
.dice[data-face="2"] .dot.br { display: block; }
.dice[data-face="3"] .dot.tl,
.dice[data-face="3"] .dot.c,
.dice[data-face="3"] .dot.br { display: block; }
.dice[data-face="4"] .dot.tl,
.dice[data-face="4"] .dot.tr,
.dice[data-face="4"] .dot.bl,
.dice[data-face="4"] .dot.br { display: block; }
.dice[data-face="5"] .dot.tl,
.dice[data-face="5"] .dot.tr,
.dice[data-face="5"] .dot.c,
.dice[data-face="5"] .dot.bl,
.dice[data-face="5"] .dot.br { display: block; }
.dice[data-face="6"] .dot.tl,
.dice[data-face="6"] .dot.tr,
.dice[data-face="6"] .dot.ml,
.dice[data-face="6"] .dot.mr,
.dice[data-face="6"] .dot.bl,
.dice[data-face="6"] .dot.br { display: block; }

/* Rolling shake animation */
.dice.rolling {
  animation: diceShake 0.12s steps(3) infinite;
}
@keyframes diceShake {
  0%   { transform: translate(0, 0) rotate(0deg); }
  25%  { transform: translate(-3px, -1px) rotate(-8deg); }
  50%  { transform: translate(3px, -2px) rotate(5deg); }
  75%  { transform: translate(-2px, 2px) rotate(-3deg); }
  100% { transform: translate(1px, 0px) rotate(0deg); }
}
/* Dice landing bounce */
.dice.landed {
  animation: diceLand 0.3s ease-out;
}
@keyframes diceLand {
  0%   { transform: translateY(-12px) rotate(15deg); }
  40%  { transform: translateY(4px) rotate(-3deg); }
  70%  { transform: translateY(-2px) rotate(1deg); }
  100% { transform: translateY(0) rotate(0deg); }
}

/* ====== Modal ====== */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal {
  background: #161b22;
  border: 2px solid #30363d;
  border-radius: 16px;
  padding: 24px;
  max-width: 500px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
}
.modal h2 {
  color: #f0c040;
  margin-bottom: 16px;
  text-align: center;
  font-size: 1.3em;
}
/* ====== Result Poster ====== */
.result-poster {
  display: flex;
  flex-direction: column;
}
.rp-header {
  padding: 18px 20px;
  text-align: center;
  margin: -24px -24px 0 -24px;
}
.rp-header.win {
  background: linear-gradient(180deg, #1a4a2a 0%, #161b22 100%);
  border-bottom: 1px solid #3fb950;
}
.rp-header.lose {
  background: linear-gradient(180deg, #4a1a1a 0%, #161b22 100%);
  border-bottom: 1px solid #f85149;
}
.rp-header h2 {
  margin: 0 0 6px;
  font-size: 1.5em;
}
.rp-header p {
  margin: 0;
  color: #c9d1d9;
  line-height: 1.4;
}
.rp-body {
  padding: 16px 4px;
}
.rp-summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 12px;
}
.rp-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 0;
}
.rp-label {
  color: #7a838c;
  font-size: 0.83em;
}
.rp-val {
  color: #e6edf3;
  font-weight: 600;
  font-size: 0.88em;
}
.rp-val.pos { color: #3fb950; }
.rp-val.neg { color: #f85149; }
.rp-quote {
  margin-top: 12px;
  padding: 10px 14px;
  background: #0d1117;
  border-radius: 6px;
  border: 1px solid #21262d;
}
.rp-quote p {
  margin: 0;
  font-size: 0.85em;
  line-height: 1.45;
}
.rp-footer {
  padding: 8px 4px 0;
  text-align: center;
}
.modal .card-type {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 10px;
  font-size: 0.75em;
  margin-bottom: 10px;
}
.card-type.small { background: #1a3a2a; color: #3fb950; }
.card-type.big { background: #1a2a3a; color: #58a6ff; }
.card-type.market { background: #3a2a1a; color: #f0c040; }
.card-type.doodad { background: #3a1a1a; color: #f85149; }
.card-type.fast { background: #3a1a3a; color: #d2a8ff; }

.modal .card-desc { margin: 10px 0; line-height: 1.6; font-size: 0.95em; }
.modal .card-fin { background: #1c2333; border-radius: 8px; padding: 10px; margin: 10px 0; font-size: 0.85em; }
.modal .card-fin .row { display: flex; justify-content: space-between; padding: 2px 0; }
.modal .btn-row { display: flex; gap: 10px; margin-top: 16px; justify-content: center; flex-wrap: wrap; }

/* ====== Welcome Screen ====== */
#welcome-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
  background: linear-gradient(180deg, #0a0e14 0%, #0d1117 30%, #0f1419 100%);
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(240,192,64,0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 50%, rgba(63,185,80,0.03) 0%, transparent 50%),
    radial-gradient(circle at 50% 20%, rgba(88,166,255,0.03) 0%, transparent 40%);
}
.ws-container { width: 100%; max-width: 680px; }
.ws-hero { text-align: center; margin-bottom: 20px; }
.ws-logo {
  font-size: 3em;
  margin-bottom: 6px;
  animation: coinBounce 3s ease-in-out infinite;
}
@keyframes coinBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.ws-title {
  font-size: 2.6em;
  font-weight: 900;
  letter-spacing: 0.08em;
  color: #f0c040;
  text-shadow: 0 0 40px rgba(240,192,64,0.25), 0 2px 4px rgba(0,0,0,0.5);
  margin-bottom: 2px;
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
}
.ws-sub {
  font-size: 1em;
  color: #f0c040;
  opacity: 0.65;
  font-weight: 600;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.ws-tagline {
  font-size: 0.85em;
  color: #484f58;
  letter-spacing: 0.5px;
}
.ws-card {
  background: #161b22;
  border: 1px solid #21262d;
  border-radius: 10px;
  padding: 20px 24px 16px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.03) inset;
}
.ws-step {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.95em;
  font-weight: 700;
  color: #e6edf3;
  margin-bottom: 10px;
}
.ws-step-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  background: #f0c040;
  color: #0d1117;
  border-radius: 4px;
  font-size: 0.8em;
  font-weight: 900;
}
.ws-goal {
  background: #0d1117;
  border: 1px solid #21262d;
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 0.82em;
  color: #8b949e;
  margin-top: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ws-goal em {
  font-style: normal;
  font-weight: 700;
}
.ws-goal em:first-of-type { color: #3fb950; }

 */
function animateValue(id, prefix, target, duration) {
  duration = duration || 800;
  const el = document.getElementById(id);
  if (!el) return;

  const key = id;
  const prev = _numCache[key] !== undefined ? _numCache[key] : target;
  _numCache[key] = target;

  if (prev === target) {
    el.textContent = prefix + target.toLocaleString();
    return;
  }

  const start = performance.now();
  const diff = target - prev;

  function step(now) {
    const elapsed = now - start;
    const progress = Math.min(1, elapsed / duration);
    // easeOutQuart 让变化先快后慢
    const eased = 1 - Math.pow(1 - progress, 4);
    const current = Math.round(prev + diff * eased);
    el.textContent = prefix + current.toLocaleString();
    if (progress < 1) {
      requestAnimationFrame(step);
    } else {
      el.textContent = prefix + target.toLocaleString();
    }
  }
  requestAnimationFrame(step);
}

/** 动画设置百分比 + 进度条 */
function animatePercent(pctId, barId, targetPct, duration) {
  duration = duration || 800;
  const key = pctId;
  const prevPct = _numCache[key] !== undefined ? _numCache[key] : targetPct;
  _numCache[key] = targetPct;

  const pctEl = document.getElementById(pctId);
  const barEl = document.getElementById(barId);

  const start = performance.now();
  const diff = targetPct - prevPct;

  function step(now) {
    const elapsed = now - start;
    const progress = Math.min(1, elapsed / duration);
    const eased = 1 - Math.pow(1 - progress, 4);
    const current = Math.round(prevPct + diff * eased);
    if (pctEl) pctEl.textContent = current + '%';
    if (barEl) barEl.style.width = current + '%';
    if (progress < 1) {
      requestAnimationFrame(step);
    } else {
      if (pctEl) pctEl.textContent = targetPct + '%';
      if (barEl) barEl.style.width = targetPct + '%';
    }
  }
  requestAnimationFrame(step);
}

/** 重置动画缓存（新游戏/读档时调用） */
function resetNumCache() {
  _numCache = {};
  const p = gameState.player;
  if (!p) return;
  const pi = getPassiveIncome(), te = getTotalExpenses(), cf = getMonthlyCashflow();
  const tav = getTotalAssetValue(), nw = getNetWorth();
  const pct = Math.min(100, Math.round((pi / te) * 100));

  _numCache['h-cash'] = p.cash;
  _numCache['b-cash'] = p.cash;
  _numCache['f-passive'] = pi;
  _numCache['f-expenses'] = te;
  _numCache['f-cashflow'] = cf;
  _numCache['fp-passive'] = pi;
  _numCache['fp-expenses'] = te;
  _numCache['b-assets'] = tav;
  _numCache['b-networth'] = nw;
  _numCache['f-passive-pct'] = pct;

  document.getElementById('h-cash').textContent = '¥' + p.cash.toLocaleString();
  document.getElementById('b-cash').textContent = '¥' + p.cash.toLocaleString();
  document.getElementById('f-salary').textContent = '¥' + p.salary.toLocaleString();
  document.getElementById('f-passive').textContent = '¥' + pi.toLocaleString();
  document.getElementById('f-expenses').textContent = '¥' + te.toLocaleString();
  document.getElementById('f-cashflow').textContent = '¥' + cf.toLocaleString();
  document.getElementById('fp-passive').textContent = pi.toLocaleString();
  document.getElementById('fp-expenses').textContent = te.toLocaleString();
  document.getElementById('b-assets').textContent = '¥' + tav.toLocaleString();
  document.getElementById('b-networth').textContent = '¥' + nw.toLocaleString();
  document.getElementById('f-passive-pct').textContent = pct + '%';
  document.getElementById('f-progress-bar').style.width = pct + '%';
}

// ==================== 存档系统 ====================
const SAVE_KEY = 'cashflow_game_save';

function saveGame() {
  const state = {
    player: gameState.player,
    month: gameState.month,
    round: gameState.round,
    position: gameState.position,
    fastTrack: gameState.fastTrack,
    fastTrackPos: gameState.fastTrackPos,
    dream: gameState.dream,
    charityRounds: gameState.charityRounds,
    skipRounds: gameState.skipRounds,
    assets: gameState.assets,
    children: gameState.children || [],
    savedAt: new Date().toISOString()
  };
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  showToast('💾 游戏已存档！');
}

function loadGame() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) return null;
  return JSON.parse(raw);
}

function hasSave() {
  return !!localStorage.getItem(SAVE_KEY);
}

function deleteSave() {
  localStorage.removeItem(SAVE_KEY);
  renderSaveSlot();
  showToast('🗑️ 存档已删除');
}

function renderSaveSlot() {
  const slot = document.getElementById('save-slot');
  if (!slot) return;
  const save = loadGame();
  if (!save) { slot.innerHTML = ''; return; }
  const savedAt = new Date(save.savedAt || Date.now());
  const time = savedAt.toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  slot.innerHTML =
    `<div style="background:#1c2333;border:1px solid #30363d;border-radius:8px;padding:12px 16px;display:inline-flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;">
      <span style="color:#8b949e;font-size:0.85em;">💾 上次存档：${save.player.name} · 第${save.round || save.month}轮 · ${time}</span>
      <button class="btn btn-sm" onclick="restoreFromSave()" style="font-size:0.82em;padding:5px 16px;">▶ 继续游戏</button>
      <button class="btn btn-sm" onclick="deleteSave()" style="background:#3a1a1a;color:#f85149;font-size:0.82em;padding:5px 12px;">✕ 删除存档</button>
    </div>`;
}

function restoreFromSave() {
  const save = loadGame();
  if (!save) return;
  gameState.player = save.player;
  gameState.month = save.month;
  gameState.round = save.round;
  gameState.position = save.position;
  gameState.fastTrack = save.fastTrack;
  gameState.fastTrackPos = save.fastTrackPos;
  gameState.dream = save.dream;
  gameState.charityRounds = save.charityRounds;
  gameState.skipRounds = save.skipRounds;
  gameState.assets = save.assets || [];
  gameState.children = (save.children || []).map(c => ({ name: c.name || ('孩子' + (Math.random() > 0.5 ? '1' : '2')) }));
  gameState.totalChildren = save.children ? save.children.length : 0;
  gameState.gameOver = false;
  gameState.diceDouble = false;
  gameState.rolling = false;

  document.getElementById('welcome-screen').style.display = 'none';
  document.getElementById('game-container').style.display = 'block';
  resetNumCache();
  updateUI();
  renderBoard();

  const dice1El = document.getElementById('dice1');
  const dice2El = document.getElementById('dice2');
  if (dice1El) dice1El.setAttribute('data-face', '1');
  if (dice2El) dice2El.setAttribute('data-face', '1');

  const savedAt = new Date(save.savedAt || Date.now());
  addLog(`💾 读取存档（${savedAt.toLocaleString('zh-CN')}），第 ${save.round || save.month} 轮`);
  showToast('💾 存档已加载，继续游戏！');

  initEasterEgg();
  _easterEggUsed = false;
  const title = document.getElementById('game-title');
  if (title) { title.style.color = ''; title.style.textShadow = ''; }
}

  { id: 'mid',       name: '中等收入',   icon: '⭐',      minSalary: 5000,  maxSalary: 6999,  cssClass: 'tier-mid',      desc: '薪资 5千 ~ 7千' },
  { id: 'mid-low',   name: '中低收入',   icon: '💼',      minSalary: 3500,  maxSalary: 4999,  cssClass: 'tier-mid-low',  desc: '薪资 3.5千 ~ 5千' },

];

let selectedCareerIdx = -1;
let activeTierId = null;

// 获取某个收入层级的职业列表
function getCareersByTier(tierId) {
  const tier = INCOME_TIERS.find(t => t.id === tierId);
  if (!tier) return [];
  return CAREERS.filter(c => c.salary >= tier.minSalary && c.salary <= tier.maxSalary);
}

// 计算每个层级的职业数量
function getTierCareerCount(tierId) {
  return getCareersByTier(tierId).length;
}

// 初始化层级选择
function initTiers() {
  const tierGrid = document.getElementById('tier-grid');
  tierGrid.innerHTML = '';
  INCOME_TIERS.forEach(tier => {
    const count = getTierCareerCount(tier.id);
    const div = document.createElement('div');
    div.className = `tier-card ${tier.cssClass}`;
    div.id = `tier-${tier.id}`;
    div.innerHTML = `
      <div class="tier-icon">${tier.icon}</div>
      <div class="tier-name">${tier.name}</div>
      <div class="tier-range">${tier.desc}</div>
      <div class="tier-count">${count} 种职业可选</div>
    `;
    div.onclick = () => selectTier(tier.id);
    tierGrid.appendChild(div);
  });
}

// 选择收入层级，展开该层级的职业列表
function selectTier(tierId) {
  activeTierId = tierId;
  selectedCareerIdx = -1;
  document.getElementById('start-btn').disabled = true;

  // 高亮选中的层级卡片
  document.querySelectorAll('.tier-card').forEach(c => c.classList.remove('active'));
  const tierCard = document.getElementById(`tier-${tierId}`);
  if (tierCard) tierCard.classList.add('active');

  // 展示第二步
  const tier = INCOME_TIERS.find(t => t.id === tierId);
  document.getElementById('career-step-title').textContent = `选择「${tier.name}」职业`;
  document.getElementById('career-step').style.display = 'block';

  // 渲染该层级职业
  const careers = getCareersByTier(tierId);
  const grid = document.getElementById('career-grid');
  grid.innerHTML = '';
  careers.forEach((c, localIdx) => {
    const globalIdx = CAREERS.indexOf(c);
    const div = document.createElement('div');
    div.className = 'career-card';
    div.innerHTML = `
      <div class="career-name">${c.name}</div>
      <div class="career-info">薪资 ¥${c.salary.toLocaleString()} | 支出 ¥${c.expenses.toLocaleString()}<br>初始现金 ¥${c.cash.toLocaleString()}${c.children > 0 ? ' | 子女 '+c.children+'人' : ''}</div>
      <div class="career-sub">${c.desc}</div>
    `;
    div.onclick = () => selectCareer(globalIdx, div);

  });

// 返回层级选择

  selectedCareerIdx = -1;

  document.getElementById('career-step').style.display = 'none';
  document.getElementById('edit-step').style.display = 'none';

  document.getElementById('career-step').style.display = 'block';
  document.querySelectorAll('.career-card').forEach(c => c.classList.remove('selected'));

function selectCareer(idx, el) {
  selectedCareerIdx = idx;
  document.querySelectorAll('.career-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');

  // 填充编辑表单
  const career = CAREERS[idx];

  document.getElementById('edit-expenses').value = career.expenses;

  document.getElementById('edit-step').style.display = 'block';
  document.getElementById('start-btn').disabled = false;

function updateEditSummary() {
  const salary   = parseInt(document.getElementById('edit-salary').value) || 0;
  const expenses = parseInt(document.getElementById('edit-expenses').value) || 0;
  const children = parseInt(document.getElementById('edit-children').value) || 0;
  const cash = Math.max(500, salary - expenses + Math.floor((salary - expenses) * 0.3));
  const cf = salary - expenses;
  const cfClass = cf >= 0 ? 'es-cf' : 'es-cf neg';
  document.getElementById('edit-summary').innerHTML =
    `初始现金：<span class="es-cash">¥${cash.toLocaleString()}</span> &nbsp;|&nbsp; 月现金流：<span class="${cfClass}">¥${cf.toLocaleString()}</span> &nbsp;|&nbsp; 财务自由门槛：<span>¥${expenses.toLocaleString()}/月</span>`;
}

function initCareers() {
  initTiers();
}

function startGame() {
  if (selectedCareerIdx < 0) return;

  // 从编辑表单读取自定义参数
  const customSalary   = parseInt(document.getElementById('edit-salary').value) || CAREERS[selectedCareerIdx].salary;
  const customExpenses = parseInt(document.getElementById('edit-expenses').value) || CAREERS[selectedCareerIdx].expenses;
  const customChildren = parseInt(document.getElementById('edit-children').value);
  const baseCareer = CAREERS[selectedCareerIdx];
  const customCash = Math.max(500, customSalary - customExpenses + Math.floor((customSalary - customExpenses) * 0.3));

  gameState.player = {
    name: baseCareer.name,
    salary: customSalary,
    expenses: customExpenses,
    cash: customCash,
    children: customChildren,
    desc: baseCareer.desc,
    initialPassive: 0,  // 起始被动收入为 0
  };
  gameState.position = 0;
  gameState.round = 1;
  gameState.month = 0; // 新游戏初始回合
  gameState.fastTrack = false;
  gameState.fastTrackPos = 0;
  gameState.dream = DREAMS[Math.floor(Math.random() * DREAMS.length)];
  gameState.charityRounds = 0;
  gameState.skipRounds = 0;
  gameState.assets = [];
  gameState.totalChildren = 0;  // legacy
  gameState.children = [];
  // 初始化子女（自定义或职业预设）
  const initKids = customChildren || 0;
  for (let i = 0; i < initKids; i++) {
    gameState.children.push({ name: '孩子' + (i + 1) });
  }
  gameState.gameOver = false;
  gameState.gameOverMsg = '';
  gameState.diceDouble = false;

  document.getElementById('welcome-screen').style.display = 'none';
  document.getElementById('game-container').style.display = 'block';
  document.getElementById('result-modal').style.display = 'none';
  document.getElementById('card-modal').style.display = 'none';

  resetNumCache();
  updateUI();
  addLog(`🎮 游戏开始！职业：${gameState.player.name}，梦想：${gameState.dream.icon} ${gameState.dream.name}`);
  addLog(`💡 提示：让你的被动收入超过总支出 ¥${getTotalExpenses().toLocaleString()}，即可跳出老鼠赛跑！`);
  renderBoard();
  initEasterEgg();
  _easterEggUsed = false;
  const title = document.getElementById('game-title');
  if (title) {
    title.style.color = '';
    title.style.textShadow = '';
  }
}
function getTotalChildrenCost() {
  return (gameState.children || []).length * 500;
}
function getTotalExpenses() {
  let base = gameState.player.expenses;
  base += getTotalChildrenCost();
  return base;
}

function getPassiveIncome() {
  return gameState.assets.reduce((sum, a) => sum + a.monthlyIncome, 0);
}

function getTotalIncome() {
  return gameState.player.salary + getPassiveIncome();
}

function getMonthlyCashflow() {
  return getTotalIncome() - getTotalExpenses();
}

function getTotalAssetValue() {
  return gameState.assets.reduce((sum, a) => sum + a.cost, 0);
}

function getNetWorth() {
  return gameState.player.cash + getTotalAssetValue();
}

function isFinanciallyFree() {
  return getPassiveIncome() >= getTotalExpenses();
}

// ==================== 彩蛋：长按标题 5 秒 ====================
let _easterEggTimer = null;
let _easterEggUsed = false;

function initEasterEgg() {
  const title = document.getElementById('game-title');
  if (!title) return;

  title.addEventListener('pointerdown', () => {
    if (_easterEggUsed) return;
    title.classList.add('easter-charging');
    _easterEggTimer = setTimeout(() => {
      _easterEggUsed = true;
      title.classList.remove('easter-charging');
      title.style.color = '#f85149';
      title.style.textShadow = '0 0 30px rgba(248,81,73,0.6)';
      activateSecret();
    }, 5000);
  });

  const release = () => { clearTimeout(_easterEggTimer); title.classList.remove('easter-charging'); };
  title.addEventListener('pointerup', release);
  title.addEventListener('pointerleave', release);
  title.addEventListener('pointercancel', release);
}

function activateSecret() {
  if (!gameState.player || gameState.fastTrack) return;

  // 赠送一个强力的被动收入资产
  const secretAsset = {
    name: '🏦 富爸爸秘籍资产',
    cost: 0,
    monthlyIncome: getTotalExpenses() - getPassiveIncome() + 500,  // 刚好超过支出
    type: 'business',
    sellPrice: 0
  };

  gameState.assets.push(secretAsset);
  updateUI();

  addLog('🔮 你发现了游戏的秘密！富人最重要的资产不是钱，而是持续产生现金流的资产。');
  addLog('🏦 获得「富爸爸秘籍资产」：现金流 +¥' + secretAsset.monthlyIncome.toLocaleString() + '/轮');
  showToast('🔮 秘籍已激活！让资产为你工作吧！');

  // 检查是否进入快车道
  if (getPassiveIncome() >= getTotalExpenses()) {
    setTimeout(() => enterFastTrack(), 1500);
  }
}

// ==================== 棋盘渲染 (HTML) ====================

const TILE_ICONS = {
  opportunity: '🎯', business: '🏢',
  market: '📈', doodad: '💸',
  charity: '❤️', child: '👶',
  unemployment: '🚫', divorce: '💔',
  tax_audit: '⚖️', lawsuit: '⚖️',
  dream: '🌟'
};

function tileCSSClass(type, isDream) {
  if (isDream) return 't-dream';
  const m = {
    opportunity: 't-opportunity', business: 't-business',
    market: 't-market', doodad: 't-doodad',
    charity: 't-charity', child: 't-child',
    unemployment: 't-unemployment', divorce: 't-unemployment',
    tax_audit: 't-tax_audit', lawsuit: 't-tax_audit'
  };
  return m[type] || '';
}

function shortTileName(name) {
  return name.replace(/^[^\s]+\s/, '');
}

function buildTileHTML(tile, idx, isCurrent) {
  return `<div class="btile ${tileCSSClass(tile.type, tile.isDream)}${isCurrent ? ' current' : ''}" data-idx="${idx}">
    <span class="bt-icon">${TILE_ICONS[tile.type] || '❓'}</span>
    <span class="bt-name">${shortTileName(tile.name)}</span>
    <span class="bt-num">${idx + 1}</span>
  </div>`;
}

function renderBoard() {
  if (!gameState.player) return;
  if (gameState.fastTrack) {
    const t = FAST_TRACK_TILES;
    document.getElementById('edge-bottom').innerHTML = t.slice(0,4).map((x,i)=>buildTileHTML(x,i,i===gameState.fastTrackPos)).join('');

// ==================== 掷骰子 ====================
function rollDice() {
  if (gameState.rolling || gameState.gameOver) return;
  if (gameState.skipRounds > 0) {
    gameState.skipRounds--;
    gameState.round++;
    gameState.month++;
    if (gameState.skipRounds > 0) {
      addLog(`⏸️ 停赛中……还差 ${gameState.skipRounds} 轮恢复（点击按钮跳过等待轮）`);
      showToast(`🚫 停赛剩余 ${gameState.skipRounds} 轮`);
    } else {
      addLog('✅ 停赛结束！恢复工作，可以正常掷骰子了');
      showToast('✅ 停赛结束，继续游戏！');
    }
    updateUI();
    renderBoard();
    return;
  }
  gameState.rolling = true;
  gameState.round++;
  gameState.month++;
  document.getElementById('roll-btn').disabled = true;

  // 每轮自动结算收入/支出
  monthlyPay();

  const dice1 = Math.floor(Math.random() * 6) + 1;
  const dice2 = gameState.charityRounds > 0 ? Math.floor(Math.random() * 6) + 1 : 0;
  const steps = dice1 + dice2;

  // Animate dice with pixel shake
  const d1El = document.getElementById('dice1');
  const d2El = document.getElementById('dice2');
  d1El.classList.add('rolling');
  if (gameState.charityRounds > 0) d2El.classList.add('rolling');

  let frames = 0;
  const diceAnim = setInterval(() => {
    const r1 = Math.floor(Math.random() * 6) + 1;
    const r2 = gameState.charityRounds > 0 ? Math.floor(Math.random() * 6) + 1 : 0;
    d1El.setAttribute('data-face', r1);
    if (gameState.charityRounds > 0) d2El.setAttribute('data-face', r2);
    frames++;
    if (frames >= 10) {
      clearInterval(diceAnim);
      d1El.classList.remove('rolling');
      d2El.classList.remove('rolling');
      d1El.setAttribute('data-face', dice1);
      d1El.classList.add('landed');
      if (gameState.charityRounds > 0) {
        d2El.setAttribute('data-face', dice2);
        d2El.classList.add('landed');
      }
      setTimeout(() => { d1El.classList.remove('landed'); d2El.classList.remove('landed'); }, 350);
      if (gameState.charityRounds > 0) gameState.charityRounds--;
      movePlayer(steps);
    }
  }, 80);
}

function movePlayer(steps) {
  if (gameState.fastTrack) {
    moveFastTrack(steps);
    return;
  }

  gameState.position = (gameState.position + steps) % RAT_RACE_TILES.length;

  addLog(`🎲 掷出 ${steps} 步，移动到: ${RAT_RACE_TILES[gameState.position].name}`);

  updateUI();
  renderBoard();
  gameState.rolling = false;
  document.getElementById('roll-btn').disabled = false;

  // Trigger tile effect after a short delay
  setTimeout(() => triggerTile(), 400);
}

function moveFastTrack(steps) {
  gameState.fastTrackPos = (gameState.fastTrackPos + steps) % FAST_TRACK_TILES.length;

  addLog(`🎲 掷出 ${steps} 步，快车道: ${FAST_TRACK_TILES[gameState.fastTrackPos].name}`);
  updateUI();
  renderBoard();
  gameState.rolling = false;
  document.getElementById('roll-btn').disabled = false;
  setTimeout(() => triggerFastTile(), 400);
}

function monthlyPay() {
  const cf = getMonthlyCashflow();
  gameState.player.cash += cf;
  const sign = cf >= 0 ? '+' : '';

  addLog(`💵 收入结算：薪资 ¥${gameState.player.salary.toLocaleString()}，支出 ¥${getTotalExpenses().toLocaleString()}，净现金流 ${sign}¥${cf.toLocaleString()}（现金: ¥${gameState.player.cash.toLocaleString()}）`);
  if (cf < 0) {
    showToast('⚠️ 现金流为负！需要增加被动收入！');
  }
  if (gameState.player.cash < 0) {
    handleBankruptcy();
  }
  updateUI();
}

function handleBankruptcy() {
  // Auto-sell assets to cover debt
  while (gameState.player.cash < 0 && gameState.assets.length > 0) {
    const asset = gameState.assets.pop();
    const sellPrice = asset.sellPrice || Math.floor(asset.cost * 0.6);
    gameState.player.cash += sellPrice;
    addLog(`⚠️ 被迫变卖「${asset.name}」获得 ¥${sellPrice.toLocaleString()} 以偿还债务`);
  }
  if (gameState.player.cash < 0) {
    gameState.player.cash = 0;
    gameState.gameOver = true;
    gameState.gameOverMsg = 'bankrupt';
    showResult('bankrupt');
  }
}

function drawMarketCard() {
  // 筛选：通用事件 + 与玩家持有资产匹配的资产事件
  const heldTypes = new Set(gameState.assets.map(a => a.type));
  const eligible = [...UNIVERSAL_EVENTS, ...ASSET_EVENTS.filter(e => heldTypes.has(e.requireAsset))];
  const pool = eligible.length > 0 ? eligible : UNIVERSAL_EVENTS; // fallback

  const card = pool[Math.floor(Math.random() * pool.length)];
  window._currentMarketCard = card;

  // 资产类事件：预览影响范围
  let previewHTML = '';
  if (card.requireAsset) {
    const targets = gameState.assets.filter(a => a.type === card.requireAsset);
    if (targets.length > 0) {
      previewHTML = `<div class="card-fin" style="margin-top:10px;">
        <div class="row"><span>🎯 影响资产</span><span style="color:#f0c040;">${targets.length} 项</span></div>
        ${targets.map(a => `<div class="row"><span style="font-size:0.8em;">${a.name}</span><span style="font-size:0.8em;color:#8b949e;">¥${a.monthlyIncome || a.cost}/轮</span></div>`).join('')}
      </div>`;
    } else {
      previewHTML = `<p style="color:#8b949e;font-size:0.85em;margin-top:8px;">⚠️ 你未持有相关资产，此事件无实际影响</p>`;
    }
  }

  document.getElementById('card-modal').style.display = 'flex';
  document.getElementById('card-modal-content').innerHTML = `
    <h2>📈 ${card.name}</h2>
    <span class="card-type market">市场风云</span>
    <p class="card-desc">${card.desc}</p>
    ${previewHTML}
    <div class="btn-row">
      <button class="btn" onclick="applyMarketEffect(); closeModal();">确认</button>
    </div>
  `;
}

function applyMarketEffect() {
  const card = window._currentMarketCard;
  if (!card) return;
  switch (card.effect) {
    case 'realestate_boost':
    case 'rent_boost':
    case 'business_cut':
    case 'business_boost':
    case 'gold_boost':
    case 'bond_boost':
    case 'land_boost':
    case 'tech_crash':
    case 'realestate_value_up':
    case 'realestate_value_up2':
    case 'stock_value_up':
    case 'business_cut30':
    case 'gold_boost_small':
    case 'bond_cut':
    case 'fund_cut':
      applyAssetEffect(card);
      break;
    case 'cash':
      gameState.player.cash += (card.amount || 1500);
      addLog(`📈 ${card.name}！获得 ¥${(card.amount || 1500).toLocaleString()}（现金：¥${gameState.player.cash.toLocaleString()}）`);
      break;
    case 'inflation': {
      const oldExp = gameState.player.expenses;
      gameState.player.expenses = Math.floor(gameState.player.expenses * 1.10);
      addLog(`📈 通货膨胀！支出 ¥${oldExp.toLocaleString()} → ¥${gameState.player.expenses.toLocaleString()}（增加 ¥${(gameState.player.expenses - oldExp).toLocaleString()}）`);
      break;
    }
    case 'deflation': {
      const oldExp = gameState.player.expenses;
      gameState.player.expenses = Math.floor(gameState.player.expenses * 0.95);
      addLog(`📉 支出下降！支出 ¥${oldExp.toLocaleString()} → ¥${gameState.player.expenses.toLocaleString()}（减少 ¥${(oldExp - gameState.player.expenses).toLocaleString()}）`);
      break;
    }
    case 'salary_up': {
      const oldSalary = gameState.player.salary;
      gameState.player.salary += (card.amount || 500);
      addLog(`📈 工资普调！薪资 ¥${oldSalary.toLocaleString()} → ¥${gameState.player.salary.toLocaleString()}（增加 ¥${(card.amount || 500).toLocaleString()}）`);
      break;
    }
    case 'pay':
      gameState.player.cash = Math.max(0, gameState.player.cash - (card.amount || 800));
      addLog(`📉 ${card.name}！扣除 ¥${(card.amount || 800).toLocaleString()}（现金：¥${gameState.player.cash.toLocaleString()}）`);
      break;
  }
  updateUI();
  renderBoard();
  if (isFinanciallyFree() && !gameState.fastTrack) enterFastTrack();
}

// 资产类事件：逐项核算明细
function applyAssetEffect(card) {
  const targets = gameState.assets.filter(a => a.type === card.requireAsset);
  if (targets.length === 0) { addLog(`📈 ${card.name} — 但你未持有相关资产，无影响`); return; }

  const lines = [];
  targets.forEach(a => {
    switch (card.effect) {
      case 'realestate_boost': {
        const old = a.monthlyIncome;
        a.monthlyIncome = Math.floor(a.monthlyIncome * 2);
        lines.push(`「${a.name}」月现金流 ¥${old.toLocaleString()} → ¥${a.monthlyIncome.toLocaleString()}（翻倍 +¥${(a.monthlyIncome - old).toLocaleString()}）`);
        break;
      }
      case 'rent_boost': {
        const old = a.monthlyIncome;
        a.monthlyIncome = Math.floor(a.monthlyIncome * 1.3);
        lines.push(`「${a.name}」月现金流 ¥${old.toLocaleString()} → ¥${a.monthlyIncome.toLocaleString()}（+30%，+¥${(a.monthlyIncome - old).toLocaleString()}）`);
        break;
      }
      case 'business_cut': {
        const old = a.monthlyIncome;
        a.monthlyIncome = Math.floor(a.monthlyIncome * 0.5);
        lines.push(`「${a.name}」月现金流 ¥${old.toLocaleString()} → ¥${a.monthlyIncome.toLocaleString()}（减半 -¥${(old - a.monthlyIncome).toLocaleString()}）`);
        break;
      }
      case 'business_boost': {
        const old = a.monthlyIncome;
        a.monthlyIncome = Math.floor(a.monthlyIncome * 2);
        lines.push(`「${a.name}」月现金流 ¥${old.toLocaleString()} → ¥${a.monthlyIncome.toLocaleString()}（翻倍 +¥${(a.monthlyIncome - old).toLocaleString()}）`);
        break;
      }
      case 'gold_boost': {
        const old = a.cost;
        a.cost = Math.floor(a.cost * 1.5);
        lines.push(`「${a.name}」估值 ¥${old.toLocaleString()} → ¥${a.cost.toLocaleString()}（升值 +¥${(a.cost - old).toLocaleString()}）`);
        break;
      }
      case 'bond_boost': {
        const old = a.monthlyIncome;
        a.monthlyIncome = Math.floor(a.monthlyIncome * 1.3);
        lines.push(`「${a.name}」月收益 ¥${old.toLocaleString()} → ¥${a.monthlyIncome.toLocaleString()}（+30%，+¥${(a.monthlyIncome - old).toLocaleString()}）`);
        break;
      }
      case 'land_boost': {
        const old = a.cost;
        a.cost = Math.floor(a.cost * 2);
        lines.push(`「${a.name}」估值 ¥${old.toLocaleString()} → ¥${a.cost.toLocaleString()}（翻倍 +¥${(a.cost - old).toLocaleString()}）`);
        break;
      }
      case 'tech_crash': {
        const old = a.cost;
        a.cost = Math.floor(a.cost * 0.5);
        lines.push(`「${a.name}」估值 ¥${old.toLocaleString()} → ¥${a.cost.toLocaleString()}（腰斩 -¥${(old - a.cost).toLocaleString()}）`);
        break;
      }
      case 'realestate_value_up': {
        const old = a.cost;
        a.cost = Math.floor(a.cost * 1.3);
        lines.push(`「${a.name}」估值 ¥${old.toLocaleString()} → ¥${a.cost.toLocaleString()}（升值 +¥${(a.cost - old).toLocaleString()}）`);
        break;
      }
      case 'realestate_value_up2': {
        const old = a.cost;
        a.cost = Math.floor(a.cost * 1.2);
        lines.push(`「${a.name}」估值 ¥${old.toLocaleString()} → ¥${a.cost.toLocaleString()}（升值 +¥${(a.cost - old).toLocaleString()}）`);
        break;
      }
      case 'stock_value_up': {
        const old = a.cost;
        a.cost = Math.floor(a.cost * 1.3);
        lines.push(`「${a.name}」估值 ¥${old.toLocaleString()} → ¥${a.cost.toLocaleString()}（升值 +¥${(a.cost - old).toLocaleString()}）`);
        break;
      }
      case 'business_cut30': {
        const old = a.monthlyIncome;
        a.monthlyIncome = Math.floor(a.monthlyIncome * 0.7);
        lines.push(`「${a.name}」月现金流 ¥${old.toLocaleString()} → ¥${a.monthlyIncome.toLocaleString()}（-30%，-¥${(old - a.monthlyIncome).toLocaleString()}）`);
        break;
      }
      case 'gold_boost_small': {
        const old = a.cost;
        a.cost = Math.floor(a.cost * 1.3);
        lines.push(`「${a.name}」估值 ¥${old.toLocaleString()} → ¥${a.cost.toLocaleString()}（升值 +¥${(a.cost - old).toLocaleString()}）`);
        break;
      }
      case 'bond_cut': {
        const old = a.monthlyIncome;
        a.monthlyIncome = Math.floor(a.monthlyIncome * 0.5);
        lines.push(`「${a.name}」月收益 ¥${old.toLocaleString()} → ¥${a.monthlyIncome.toLocaleString()}（减半 -¥${(old - a.monthlyIncome).toLocaleString()}）`);
        break;
      }
      case 'fund_cut': {
        const old = a.monthlyIncome;
        a.monthlyIncome = Math.floor(a.monthlyIncome * 0.7);
        lines.push(`「${a.name}」月收益 ¥${old.toLocaleString()} → ¥${a.monthlyIncome.toLocaleString()}（-30%，-¥${(old - a.monthlyIncome).toLocaleString()}）`);
        break;
      }
    }
  });

  const isNeg = ['business_cut','tech_crash','business_cut30','bond_cut','fund_cut','pay'].includes(card.effect);
  const emoji = isNeg ? '📉' : '📈';
  addLog(`${emoji} ${card.name}！${targets.length}项资产受影响：`);
  lines.forEach(l => addLog(`   ${l}`));
  addLog(`   📊 被动收入更新为 ¥${getPassiveIncome().toLocaleString()}/月，净资产 ¥${getNetWorth().toLocaleString()}`);
}

// ==================== 额外支出 ====================
function drawDoodadCard() {
  const card = DOODADS[Math.floor(Math.random() * DOODADS.length)];
  document.getElementById('card-modal').style.display = 'flex';
  document.getElementById('card-modal-content').innerHTML = `
    <h2>💸 ${card.name}</h2>
    <span class="card-type doodad">额外支出</span>
    <p class="card-desc">${card.desc}</p>
    <div class="card-fin">
      <div class="row"><span>支出金额</span><span style="color:#f85149;font-weight:bold;">¥${card.cost.toLocaleString()}</span></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-red" onclick="gameState.player.cash = Math.max(0, gameState.player.cash - ${card.cost}); addLog('💸 ${card.name}，支付 ¥${card.cost.toLocaleString()}'); updateUI(); renderBoard(); closeModal();">支付</button>
    </div>
  `;
}

// ==================== 慈善 ====================
function doCharity(donation) {
  gameState.player.cash -= donation;
  gameState.charityRounds = 3;
  addLog(`❤️ 捐款 ¥${donation.toLocaleString()}，获得3轮双骰特权！`);
  showToast('🙏 善有善报！获得双骰特权3轮');
  showRichDadWisdom('charity');
  updateUI();
  closeModal();
}
function showCharityChoice() {
  const donation = Math.floor(gameState.player.salary * 0.1);
  document.getElementById('card-modal').style.display = 'flex';
  document.getElementById('card-modal-content').innerHTML = `
    <h2>❤️ 慈善事业</h2>
    <span class="card-type market">慈善</span>
    <p class="card-desc">捐出你总收入的10%（¥${donation.toLocaleString()}），获得接下来3轮使用两颗骰子的特权！</p>
    <div class="btn-row">
      <button class="btn" onclick="doCharity(${donation})">🙏 捐款</button>
      <button class="btn btn-red btn-sm" onclick="closeModal()">跳过</button>
    </div>
  `;
}

// ==================== 生孩子 ====================
function haveChild() {
  gameState.children = gameState.children || [];
  if (gameState.children.length >= 3) {
    showToast('👶 孩子已满3个，生不下了~');
    return;
  }
  gameState.children.push({ name: '孩子' + (gameState.children.length + 1) });
  addLog(`👶 恭喜！家里添了一个孩子！每轮支出 +¥500（共 ${gameState.children.length} 个孩子）`);
  showToast('👶 家里添了新成员！每轮支出 +¥500');
  updateUI();
}

// ==================== 失业 ====================
function unemployment() {
  const cost = getTotalExpenses();
  gameState.player.cash = Math.max(0, gameState.player.cash - cost);
  gameState.skipRounds = 2;
  addLog(`🚫 失业！支付总支出 ¥${cost.toLocaleString()}，停赛2轮`);
  showToast('🚫 失业了！停赛2轮');
  updateUI();
}

// ==================== 卖出资产 ====================
function sellAsset(index) {
  const asset = gameState.assets[index];
  const sellPrice = asset.sellPrice || Math.floor(asset.cost * 0.6);
  gameState.player.cash += sellPrice;
  addLog(`🏷️ 卖出「${asset.name}」获得 ¥${sellPrice.toLocaleString()}（损失了 ¥${(asset.cost - sellPrice).toLocaleString()}）`);
  gameState.assets.splice(index, 1);
  updateUI();
  renderBoard();
  showToast(`卖出资产，获得 ¥${sellPrice.toLocaleString()}`);
  showRichDadWisdom('sell_asset');
}

// ==================== 进入快车道 ====================
function enterFastTrack() {
  gameState.fastTrack = true;
  gameState.fastTrackPos = 0;
  gameState.skipRounds = 0;
  gameState.charityRounds = 0;
  const bonus = getPassiveIncome() * 100;
  gameState.player.cash += bonus;
  addLog(`🚀🎉 恭喜！你跳出了老鼠赛跑圈！被动收入 ¥${getPassiveIncome().toLocaleString()} > 总支出 ¥${getTotalExpenses().toLocaleString()}`);
  addLog(`💰 进入快车道奖励：非工资收入 × 100 = ¥${bonus.toLocaleString()}！`);
  showToast('🎉 财务自由！进入快车道！');
  showRichDadWisdom('financial_free');
  document.getElementById('h-mode').textContent = '🚀 快车道';
  document.getElementById('h-mode').style.color = '#3fb950';
  updateUI();
  renderBoard();
  document.getElementById('card-modal').style.display = 'none';
}

// ==================== 快车道事件 ====================
function fastPayday() {
  const bonus = getPassiveIncome() * 50;
  gameState.player.cash += bonus;
  addLog(`💰 快车道现金流日！获得 ¥${bonus.toLocaleString()}`);
  updateUI();
  renderBoard();
}

function taxAudit() {
  const loss = Math.floor(gameState.player.cash * 0.5);
  gameState.player.cash -= loss;
  addLog(`⚖️ 税务审计！损失50%现金：¥${loss.toLocaleString()}`);
  showToast('⚖️ 税务审计！损失50%现金');
  updateUI();
}

function divorce() {
  const loss = gameState.player.cash;
  gameState.player.cash = 0;
  addLog(`💔 离婚！失去全部现金 ¥${loss.toLocaleString()}`);
  showToast('💔 离婚！失去了全部现金');
  updateUI();
}

function lawsuit() {
  const loss = Math.floor(gameState.player.cash * 0.5);
  gameState.player.cash -= loss;
  addLog(`⚡ 官司缠身！损失50%现金：¥${loss.toLocaleString()}`);
  showToast('⚡ 官司！损失50%现金');
  updateUI();
}

function drawFastBusinessCard() {
  const card = BIG_DEALS[Math.floor(Math.random() * BIG_DEALS.length)];
  const boostCard = { ...card, income: Math.floor(card.income * 1.5) };
  showCardModal('fast', boostCard, () => {
    if (gameState.player.cash >= boostCard.cost) {
      gameState.player.cash -= boostCard.cost;
      gameState.assets.push({
        name: boostCard.name + '(快车道)',
        cost: boostCard.cost,
        monthlyIncome: boostCard.income,
        type: boostCard.type,
        sellPrice: Math.floor(boostCard.cost * 0.6),
      });
      addLog(`🏢 快车道收购「${boostCard.name}」月现金流 +¥${boostCard.income}`);
      showToast(`🏢 收购成功！被动收入 +¥${boostCard.income}/月`);
      showRichDadWisdom('buy_asset');
    } else {
      showToast('❌ 现金不足！');
    }
    updateUI();
    renderBoard();
  });
}

function showDreamTile() {
  if (gameState.player.cash >= gameState.dream.cost) {
    document.getElementById('card-modal').style.display = 'flex';
    document.getElementById('card-modal-content').innerHTML = `
      <h2>🌟 你的梦想：${gameState.dream.icon} ${gameState.dream.name}</h2>
      <span class="card-type fast">梦想</span>
      <p class="card-desc">你来到了梦想格！花费 ¥${gameState.dream.cost.toLocaleString()} 就能买下你的梦想！</p>
      <div class="btn-row">
        <button class="btn" onclick="buyDream()">💎 买下梦想！</button>
      </div>
    `;
  } else {
    addLog(`🌟 到达梦想格！但现金不足（需要 ¥${gameState.dream.cost.toLocaleString()}，当前 ¥${gameState.player.cash.toLocaleString()}）`);
    showToast(`梦想近在咫尺！还需 ¥${(gameState.dream.cost - gameState.player.cash).toLocaleString()}`);
  }
}

function buyDream() {
  gameState.player.cash -= gameState.dream.cost;
  gameState.gameOver = true;
  gameState.gameOverMsg = 'win';
  closeModal();
  showResult('win');
  addLog(`🎉🏆 恭喜！你买下了梦想「${gameState.dream.icon} ${gameState.dream.name}」！你赢得了游戏！`);
  showRichDadWisdom('buy_dream');
  updateUI();
  renderBoard();
}

// ==================== Modal Helpers ====================
function closeModal() {
  document.getElementById('card-modal').style.display = 'none';
}

function showResult(type) {
  document.getElementById('result-modal').style.display = 'flex';
  const isWin = type === 'win';
  const title = isWin ? '🎉 恭喜财务自由' : '💸 游戏结束 - 破产';
  const titleColor = isWin ? '#3fb950' : '#f85149';
  const subtitle = isWin
    ? `你已经实现了财务自由，买下了梦想：<br><strong style="color:#f0c040;font-size:1.3em;">${gameState.dream.icon} ${gameState.dream.name}</strong>`
    : '现金耗尽，无法继续支付月度支出，游戏结束。';

  // 分类统计资产
  const assetsByType = {};
  gameState.assets.forEach(a => {
    assetsByType[a.type] = (assetsByType[a.type] || 0) + 1;
  });
  const assetBreakdown = Object.entries(assetsByType)
    .map(([t, cnt]) => {
      const labels = { realestate:'房地产', business:'生意', stock:'股票', gold:'黄金', bond:'债券', land:'土地', fund:'基金' };
      return `${labels[t] || t}: ${cnt} 项`;
    })
    .join(' • ');

  // 计算关键指标
  const startingPassive = gameState.player.initialPassive || 0;
  const finalPassive = getPassiveIncome();
  const passiveGrowth = finalPassive - startingPassive;
  const totalExpenses = getTotalExpenses();
  const freedomPercent = Math.round((finalPassive / totalExpenses) * 100);
  const startSalary = gameState.player.salary;

  document.getElementById('result-modal-content').innerHTML = `
    <div class="result-poster">
      <div class="rp-header ${isWin ? 'win' : 'lose'}">
        <h2>${title}</h2>
        <p>${subtitle}</p>
      </div>
      <div class="rp-body">
        <div class="rp-summary">
          <div class="rp-row">
            <span class="rp-label">初始职业</span>
            <span class="rp-val">${gameState.player.name}</span>
          </div>
          <div class="rp-row">
            <span class="rp-label">起始薪资</span>
            <span class="rp-val">¥${startSalary.toLocaleString()}</span>
          </div>
          <div class="rp-row">
            <span class="rp-label">最终资产</span>
            <span class="rp-val">¥${getNetWorth().toLocaleString()}</span>
          </div>
          <div class="rp-row">
            <span class="rp-label">剩余现金</span>
            <span class="rp-val">¥${gameState.player.cash.toLocaleString()}</span>
          </div>
          <div class="rp-row">
            <span class="rp-label">起始被动收入</span>
            <span class="rp-val">¥${startingPassive}/轮</span>
          </div>
          <div class="rp-row">
            <span class="rp-label">最终被动收入</span>
            <span class="rp-val ${passiveGrowth > 0 ? 'pos' : 'neg'}">¥${finalPassive}/月 (${passiveGrowth > 0 ? '+' : ''}${passiveGrowth})</span>
          </div>
          <div class="rp-row">
            <span class="rp-label">财务自由进度</span>
            <span class="rp-val ${freedomPercent >= 100 ? 'pos' : ''}">${freedomPercent}%</span>
          </div>
          <div class="rp-row">
            <span class="rp-label">持有资产</span>
            <span class="rp-val">${gameState.assets.length} 项</span>
          </div>
          <div class="rp-row">
            <span class="rp-label">子女</span>
            <span class="rp-val">${(gameState.children || []).length} 人</span>
          </div>
          <div class="rp-row">
            <span class="rp-label">总回合数</span>
            <span class="rp-val">${gameState.round} 轮</span>
          </div>
          <div class="rp-row" style="grid-column: 1 / -1; margin-top:8px;">
            <span class="rp-label">资产分布</span>
            <span class="rp-val">${assetBreakdown || '无'}</span>
          </div>
        </div>
        <div class="rp-quote">
          <p>${isWin
            ? '<span style="color:#3fb950;">💪 恭喜！你已经让钱为你工作了，从此进入快车道！</span>'
            : '<span style="color:#f85149;">💡 记住：破产只是暂时的，关键是买对资产，让资产为你赚钱。</span>'
          }</p>
        </div>
      </div>
      <div class="rp-footer">
        <button class="btn ${isWin ? '' : 'btn-red'}" onclick="restartGame()">🔄 再来一局</button>
      </div>
    </div>
  `;
}

function restartGame() {
  document.getElementById('result-modal').style.display = 'none';
  document.getElementById('card-modal').style.display = 'none';
  document.getElementById('game-container').style.display = 'none';
  document.getElementById('welcome-screen').style.display = 'flex';
  document.getElementById('start-btn').disabled = true;
  document.getElementById('start-btn').textContent = '开始游戏';
  document.getElementById('career-step').style.display = 'none';
  document.getElementById('edit-step').style.display = 'none';
  document.getElementById('career-grid').innerHTML = '';
  document.querySelectorAll('.career-card').forEach(c => c.classList.remove('selected'));
  document.querySelectorAll('.tier-card').forEach(c => c.classList.remove('active'));
  selectedCareerIdx = -1;
  activeTierId = null;
  _easterEggUsed = false;
  const title = document.getElementById('game-title');
  if (title) { title.style.color = ''; title.style.textShadow = ''; }
  document.getElementById('msg-log').innerHTML = '';
  initCareers();
  renderSaveSlot();
  gameState = {
    player: null, position: 0, round: 1, month: 0, fastTrack: false, fastTrackPos: 0,
    dream: null, diceDouble: false, charityRounds: 0, skipRounds: 0,
    assets: [], totalChildren: 0, children: [], gameOver: false, gameOverMsg: '', rolling: false,
  };
}

// ==================== 键盘快捷键 ====================
document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    if (!gameState.rolling && !gameState.gameOver && gameState.player) rollDice();
  }
  if (e.key === 'Escape') closeModal();
});

// ==================== Resize ====================
window.addEventListener('resize', () => {
  if (gameState.player) renderBoard();
});

// ==================== 启动 ====================
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('roll-btn').addEventListener('click', rollDice);
document.getElementById('restart-btn').addEventListener('click', restartGame);

initCareers();
renderSaveSlot();
addLog('📋 请选择你的职业开始游戏...');
</script>
